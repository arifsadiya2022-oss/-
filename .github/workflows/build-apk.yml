name: Build Arif Game Booster APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare debug signing keystore and env
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          touch .env

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Build Signed Release APK (when release secrets are configured)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
          gradle :app:assembleRelease

      - name: Stage APK assets for release
        run: |
          mkdir -p dist-apks
          cp app/build/outputs/apk/debug/app-debug.apk dist-apks/arif-game-booster-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist-apks/app-release.apk
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arif-game-booster-apks
          path: dist-apks/*.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build-${{ github.run_number }}
          name: Arif Game Booster v1.0 (Build ${{ github.run_number }})
          body: Installable Android APK for Arif Game Booster (com.arif.gamebooster, Android 8.0+).
          files: dist-apks/*.apk
